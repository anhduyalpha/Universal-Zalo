version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: universal_zalo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    container_name: universal_zalo_postgres
    environment:
      POSTGRES_USER: zalo_admin
      POSTGRES_PASSWORD: zalo_secure_password
      POSTGRES_DB: universal_zalo
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  redis_data:
  pg_data:
